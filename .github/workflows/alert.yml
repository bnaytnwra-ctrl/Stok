name: Stock News Alert Bot

# مصمم ليناسب باقة GitHub المجانية (~81 دقيقة يوميًا ≈ 1700-1860 شهريًا < 2000)
on:
  schedule:
    # قبل الافتتاح: 12:45 UTC = 8:45 نيويورك (صيفًا) — تقويم + فحص لحظي 45 دقيقة
    - cron: "45 12 * * 1-5"
    # الإغلاق وبعده: 20:00 UTC = 16:00 نيويورك (صيفًا) — فحص لحظي 30 دقيقة
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "وضع التشغيل اليدوي (اختر test أول مرة للتحقق من وصول التنبيهات)"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - both
          - calendar
          - realtime

permissions:
  contents: write

concurrency:
  group: stock-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            # التشغيل اليدوي: فحص سريع لمرة واحدة (ينتهي خلال دقيقة تقريبًا)
            echo "single=true" >> "$GITHUB_OUTPUT"
            echo "window=30" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "45 12 * * 1-5" ]; then
            # نافذة ما قبل الافتتاح: تقويم المحفزات + فحص لحظي 45 دقيقة
            echo "value=both" >> "$GITHUB_OUTPUT"
            echo "single=false" >> "$GITHUB_OUTPUT"
            echo "window=45" >> "$GITHUB_OUTPUT"
          else
            # نافذة الإغلاق: فحص لحظي 30 دقيقة فقط (التقويم صباحًا يكفي)
            echo "value=realtime" >> "$GITHUB_OUTPUT"
            echo "single=false" >> "$GITHUB_OUTPUT"
            echo "window=30" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REALTIME_WINDOW_MINUTES: ${{ steps.mode.outputs.window }}
          REALTIME_SINGLE_PASS: ${{ steps.mode.outputs.single }}
        run: python bot.py --mode ${{ steps.mode.outputs.value }}

      - name: Commit and push logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || git pull --no-rebase -X ours || true
          git add logs/
          if git diff --staged --quiet; then
            echo "لا توجد سجلات جديدة للحفظ"
          else
            git commit -m "chore: update bot logs [skip ci]"
            git push || (git pull --rebase && git push)
          fi
