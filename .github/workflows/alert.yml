name: Stock News Alert Bot

# ~5.5 ساعة يوميًا. المستودع عام (Public) فدقائق Actions مجانية بلا حد؛ لو حوّلته Private قلّل النوافذ (الحد 2000 دقيقة/شهر)
on:
  schedule:
    # الجدولة بتوقيت UTC وتغطي التوقيت الصيفي والشتوي معًا؛ خطوة "Decide run"
    # تتجاهل التشغيلة التي لا تطابق الساعة المطلوبة بتوقيت نيويورك.
    # النافذة 1: 07:00 → 10:00 نيويورك (بري ماركت + افتتاح السوق) + تقويم المحفزات
    - cron: "0 11 * * 1-5"
    - cron: "0 12 * * 1-5"
    # النافذة 2: 15:00 → 17:30 نيويورك (قبل الإغلاق + الإغلاق + ما بعده)
    - cron: "0 19 * * 1-5"
    - cron: "0 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "وضع التشغيل اليدوي (اختر test أول مرة للتحقق من وصول التنبيهات)"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - both
          - calendar
          - realtime

permissions:
  contents: write

concurrency:
  group: stock-news-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Decide run
        id: mode
        run: |
          ET_HOUR=$(TZ=America/New_York date +%-H)
          echo "الساعة الآن بنيويورك: $ET_HOUR"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "single=true" >> "$GITHUB_OUTPUT"
            echo "window=30" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 11 * * 1-5" ] || [ "${{ github.event.schedule }}" = "0 12 * * 1-5" ]; then
            if [ "$ET_HOUR" != "7" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            END=$(TZ=America/New_York date -d "10:00" +%s)
            echo "value=both" >> "$GITHUB_OUTPUT"      # تقويم مرة واحدة + فحص لحظي
            echo "single=false" >> "$GITHUB_OUTPUT"
            echo "window=$(( (END - $(date +%s)) / 60 ))" >> "$GITHUB_OUTPUT"
          else
            if [ "$ET_HOUR" != "15" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            END=$(TZ=America/New_York date -d "17:30" +%s)
            echo "value=realtime" >> "$GITHUB_OUTPUT"
            echo "single=false" >> "$GITHUB_OUTPUT"
            echo "window=$(( (END - $(date +%s)) / 60 ))" >> "$GITHUB_OUTPUT"
          fi

      - name: Run bot
        if: steps.mode.outputs.skip != 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          REALTIME_WINDOW_MINUTES: ${{ steps.mode.outputs.window }}
          REALTIME_SINGLE_PASS: ${{ steps.mode.outputs.single }}
        run: python bot.py --mode ${{ steps.mode.outputs.value }}

      - name: Commit and push logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || git pull --no-rebase -X ours || true
          git add logs/
          if git diff --staged --quiet; then
            echo "لا توجد سجلات جديدة للحفظ"
          else
            git commit -m "chore: update bot logs [skip ci]"
            git push || (git pull --rebase && git push)
          fi
