name: Stock News Alert Bot

on:
  schedule:
    - cron: '0 10 * * 1-5'
    - cron: '30 19 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-news-bot
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitoring window
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python src/main.py

      - name: Commit and push updated logs
        run: |
          git config user.name "stock-news-bot"
          git config user.email "actions@github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "تحديث سجل التنبيهات [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
